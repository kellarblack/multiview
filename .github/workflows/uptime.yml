name: weekly uptime and feed health

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'tools/health-check.py'
      - '.github/workflows/uptime.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the live site
        run: |
          set -e
          for path in / /tv /help /status /BUILD.txt /health.json; do
            code=$(curl -L -s -o /dev/null -w '%{http_code}' "https://multiview.cc$path")
            echo "$path $code"
            test "$code" = "200"
          done
      - name: Check curated feeds
        run: python3 tools/health-check.py --out health.json
      - name: Publish health.json
        run: |
          if git diff --quiet health.json; then
            echo "health unchanged"
            exit 0
          fi
          git config user.name "multiview health"
          git config user.email "health@multiview.cc"
          git add health.json
          git commit -m "health: $(date -u +%FT%TZ)"
          git push
