name: daily uptime and feed health

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'tools/health-check.py'
      - '.github/workflows/uptime.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the live pages and the curated feeds
        run: python3 tools/health-check.py --out health.json --uptime uptime.json --site
      - name: Publish health.json and the uptime history
        run: |
          if git diff --quiet health.json uptime.json; then
            echo "health unchanged"
            exit 0
          fi
          git config user.name "multiview health"
          git config user.email "health@multiview.cc"
          git add health.json uptime.json
          git commit -m "health: $(date -u +%FT%TZ)"
          git push
