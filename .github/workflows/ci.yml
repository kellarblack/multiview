name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - run: python3 tools/deploy-check.py
      - name: Client regression
        run: |
          python3 tests/mock-jellyfin.py 8123 >/tmp/jellyfin.log 2>&1 &
          python3 -m http.server 5455 >/tmp/http.log 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --window-size=1280,900             --virtual-time-budget=90000 --dump-dom http://localhost:5455/tests/regression.html             > /tmp/regression.html
          python3 tools/check-regression.py /tmp/regression.html
