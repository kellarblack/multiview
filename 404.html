<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>multiview not found</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(700px 420px at 50% 0%, rgba(110, 168, 255, .13), transparent 70%),
      #08090c;
    color: #e8eef7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .mark { display: inline-grid; grid-template-columns: repeat(2, 9px); gap: 3px; margin-bottom: 26px; }
  .mark i { width: 9px; height: 9px; border-radius: 3px; background: #6ea8ff; }
  .mark i:nth-child(2), .mark i:nth-child(3) { background: rgba(255, 255, 255, .3); }
  p.eyebrow {
    margin: 0 0 12px;
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #7f9dc9;
  }
  h1 { margin: 0 0 12px; font-size: clamp(30px, 6vw, 44px); letter-spacing: -.035em; }
  p.copy { margin: 0 auto 26px; max-width: 38ch; font-size: 13.5px; line-height: 1.6; color: #98a3b4; }
  a.btn {
    display: inline-flex;
    align-items: center;
    height: 34px;
    padding: 0 16px;
    border-radius: 9px;
    border: 1px solid rgba(110, 168, 255, .4);
    background: rgba(110, 168, 255, .12);
    color: #dce9ff;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
  }
  a.btn:hover { background: rgba(110, 168, 255, .2); }
  p.foot { margin: 22px 0 0; font-size: 11.5px; color: #5f6877; }
  p.foot a { color: #7f9dc9; text-decoration: none; border-bottom: .5px solid rgba(127, 157, 201, .35); }
  p.foot a:hover { color: #a9c9ff; }
</style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <p class="eyebrow">404</p>
    <h1>That tile isn't here.</h1>
    <p class="copy">The page moved or never existed. Your boards are still saved in this browser.</p>
    <a class="btn" href="./">Back to the wall</a>
    <p class="foot"><a href="legal.html">Legal &amp; privacy</a> · © 2026 multiview.cc</p>
  </main>
</body>
</html>
