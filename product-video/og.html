<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>multiview.cc — og</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#070a10;color:#eef3fb;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  #stage{position:relative;width:1200px;height:630px;overflow:hidden;
    background:
      radial-gradient(760px 420px at 10% -18%, rgba(62,112,210,.30), transparent 64%),
      radial-gradient(620px 360px at 92% -10%, rgba(48,150,190,.18), transparent 66%),
      radial-gradient(520px 340px at 50% 118%, rgba(28,74,150,.12), transparent 68%),
      #070a10}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.45)}
  .pad{position:absolute;left:64px;top:56px;width:600px}
  .brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;letter-spacing:.06em;color:#c2d9ff}
  .logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
  .logo i{display:block;border-radius:2px;background:#8fb8ff}
  .logo i:nth-child(2),.logo i:nth-child(3){background:rgba(255,255,255,.28)}
  h1{margin:34px 0 0;font-size:78px;line-height:.94;letter-spacing:-.05em;font-weight:760;color:#f4f7fb}
  h1 .blue{color:#8fb8ff}
  p{margin:24px 0 0;max-width:520px;font-size:22px;line-height:1.35;letter-spacing:-.01em;color:#aab5c5}
  .pill{display:inline-flex;align-items:center;gap:8px;margin-top:30px;height:34px;padding:0 14px;border:1px solid rgba(71,211,154,.28);
    border-radius:999px;background:rgba(71,211,154,.08);color:#bff3dc;font-size:13px;font-weight:600}
  .pill i{width:7px;height:7px;border-radius:50%;background:#47d39a;box-shadow:0 0 0 3px rgba(71,211,154,.14)}
  .foot{position:absolute;left:64px;bottom:44px;font-size:12px;font-weight:560;letter-spacing:.05em;color:#7c8697}
  .wall{position:absolute;right:56px;top:96px;width:492px;height:438px;padding:6px;border:1px solid rgba(255,255,255,.14);
    border-radius:16px;background:rgba(10,14,22,.9);box-shadow:0 40px 90px -40px #000, inset 0 0 0 1px rgba(255,255,255,.04);
    transform:rotateY(-6deg) rotateX(2deg);transform-origin:50% 50%}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:3px;width:100%;height:100%;border-radius:12px;overflow:hidden;background:#05070a}
  .grid img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.02) contrast(1.05) brightness(.88)}
  .badge{position:absolute;right:18px;top:18px;z-index:2;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;
    border:1px solid rgba(255,92,98,.3);border-radius:999px;background:rgba(8,10,14,.78);color:#ffe1e3;font-size:10px;font-weight:650;letter-spacing:.04em}
  .badge i{width:6px;height:6px;border-radius:50%;background:#ff5f66}
  .tv{position:absolute;left:18px;top:18px;z-index:2;display:inline-flex;align-items:center;height:24px;padding:0 9px;border:1px solid rgba(110,168,255,.35);
    border-radius:999px;background:linear-gradient(180deg,rgba(110,168,255,.18),rgba(95,212,255,.08));color:#e6f2ff;font-size:10px;font-weight:650;letter-spacing:.04em}
</style></head>
<body><div id="stage">
  <div class="pad">
    <div class="brand"><span class="logo"><i></i><i></i><i></i><i></i></span> multiview</div>
    <h1>up to <span class="blue">4 streams</span>.<br><span class="blue">one screen</span>.</h1>
    <p>paste a link. it plays. football, news, whatever — one wall.</p>
    <span class="pill"><i></i>free while we're in beta</span>
  </div>
  <div class="wall">
    <span class="badge"><i></i>4 LIVE</span>
    <div class="grid">
      <img src="https://i.ytimg.com/vi/y-jR93AytPc/maxres2.jpg"><img src="https://i.ytimg.com/vi/p4aNGqai4ec/maxres3.jpg">
      <img src="https://i.ytimg.com/vi/QkGOollG-S4/maxres3.jpg"><img src="https://i.ytimg.com/vi/MRO9RbJuZLg/maxres1.jpg">
    </div>
  </div>
  <div class="foot">youtube · twitch · iptv · jellyfin · any url</div>
</div></body></html>
